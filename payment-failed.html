<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Оплата не завершена — Magic eSIM</title>
  <meta name="robots" content="noindex" />
  <meta name="description" content="Оплата Magic eSIM не была завершена." />
  <style>
    :root{--bg:#0a0d16;--text:#eef1f8;--muted:#9aa3bd;--cyan:#5aa9c9;--blue:#5f72c4;--warn:#e6c168;--border:rgba(255,255,255,.10);--max:640px}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);
      background:
        radial-gradient(900px circle at 12% -6%, rgba(95,114,196,.10), transparent 60%),
        radial-gradient(820px circle at 100% 2%, rgba(90,169,201,.08), transparent 55%),
        var(--bg);line-height:1.6}
    a{color:var(--cyan);text-decoration:none}a:hover{text-decoration:underline}
    .card{width:min(var(--max),100%);border:1px solid var(--border);border-radius:18px;background:rgba(255,255,255,.035);
      padding:36px 32px 32px;text-align:center;backdrop-filter:blur(6px)}
    .brand{font-size:20px;font-weight:700;letter-spacing:-.04em;margin-bottom:24px;
      background:linear-gradient(90deg,#cfd6ff,var(--blue),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
    .icon{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;font-size:28px;
      color:var(--warn);border:1px solid rgba(230,193,104,.4);background:rgba(230,193,104,.10)}
    h1{font-size:clamp(22px,4vw,30px);letter-spacing:-.02em;margin:0 0 10px}
    .msg{color:#d7ddf0;margin:0 auto;max-width:460px}
    .sub{color:var(--muted);font-size:14px;margin:14px auto 0;max-width:460px}
    .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:26px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:12px;
      border:1px solid rgba(255,255,255,.14);background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;font-weight:700;font-size:15px}
    .btn:hover{text-decoration:none;transform:translateY(-2px)}
    .btn.secondary{background:rgba(255,255,255,.05);color:var(--text)}
    @media(max-width:560px){.card{padding:28px 20px 24px}}
  </style>
  <!-- Light theme (redesign 2026-07): re-skin only -->
  <style>
    :root{--bg:#F7F9FC;--text:#111827;--muted:#667085;--cyan:#4267E8;--blue:#4267E8;--border:#E6EAF2}
    body{background:#F7F9FC!important}
    .card{background:#fff!important;box-shadow:0 8px 24px rgba(17,24,39,.06);backdrop-filter:none}
    .brand{background:linear-gradient(135deg,#8A16C7,#3866D9,#00C7DF)!important;-webkit-background-clip:text;background-clip:text;color:transparent}
    .msg{color:#334155!important}
    .btn{background:#4267E8!important;border:0!important;color:#fff!important;border-radius:999px}
    .btn.secondary{background:#fff!important;color:#111827!important;border:1px solid #E6EAF2!important}
    .icon{background:#F1F4FA!important;border-color:#E6EAF2!important}
    .warn .icon,.err .icon{color:#b42318!important;background:rgba(217,45,32,.10)!important;border-color:rgba(217,45,32,.30)!important}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Magic eSIM</div>
    <div class="icon">!</div>
    <h1>Оплата не завершена</h1>
    <p class="msg">Похоже, платёж не был завершён. Средства не списаны. Вы можете вернуться к тарифам и оформить заказ заново — это займёт пару минут.</p>
    <p class="sub">Если возникли вопросы, мы поможем: <a href="mailto:support@magicesim.store">support@magicesim.store</a></p>
    <div class="actions">
      <a class="btn" href="index.html#global-pricing">Вернуться к тарифам</a>
      <a class="btn secondary" href="mailto:support@magicesim.store">Связаться с поддержкой</a>
    </div>
  </main>
</body>
</html>
