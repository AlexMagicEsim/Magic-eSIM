# magicesim.store on nginx — the storefront's static site with REAL 301s (GitHub Pages cannot send them).
#
# Hand-written. The only redirects typed here are the host/scheme ones (http -> https, www -> apex) and the directory
# slash. EVERY path redirect comes from the one URL map (seo/url-migration.mjs) through the two GENERATED files
# included below — never add a `return 301` / `rewrite` for a page path here (seo/test-web-server-config.mjs).
#
# Included in the http {} context (Debian/Ubuntu: /etc/nginx/conf.d/magicesim.conf holding the one line
# `include /srv/magicesim/current/nginx/site.conf;`). Layout on the host, one directory per release:
#   /srv/magicesim/releases/<UTC timestamp>/site/    the Pages artifact (scripts/build-pages-artifact.mjs --out)
#   /srv/magicesim/releases/<UTC timestamp>/nginx/   this file + the generated redirects.conf, country-map.conf
#   /srv/magicesim/current -> releases/<one of them>  switched atomically by .github/workflows/deploy-web.yml
#
# Pages-equivalent on purpose: the same Cache-Control (max-age=600), Access-Control-Allow-Origin *, gzip, types and
# charset, 404.html with status 404 for anything that is not a file (it is also the /pay/<token> and /pay/s/<secret>
# router). NO HSTS, X-Frame-Options or header CSP (owner decision: keep what Pages sends; README lists them as later
# options). No language, IP or user-agent logic anywhere.

include /srv/magicesim/current/nginx/country-map.conf;

# Hosts this file does not know: no answer at all (a scanner hitting the IP gets no copy of the site).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# :80 — ACME HTTP-01 answers, everything else one 301 to https on the apex (www goes straight to the apex: one hop).
server {
    listen 80;
    listen [::]:80;
    server_name magicesim.store www.magicesim.store;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://magicesim.store$request_uri;
    }
}

# https://www -> https://apex, same URI and query.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.magicesim.store;

    # PLACEHOLDERS for certbot / Let's Encrypt (one certificate covering both names; see infra/web/README.md).
    ssl_certificate     /etc/letsencrypt/live/magicesim.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magicesim.store/privkey.pem;

    return 301 https://magicesim.store$request_uri;
}

# The site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name magicesim.store;

    ssl_certificate     /etc/letsencrypt/live/magicesim.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magicesim.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:magicesim_tls:10m;

    root /srv/magicesim/current/site;
    server_tokens off;

    # Redirect Locations are absolute, like Pages': https://magicesim.store/<path>, never the internal port.
    absolute_redirect on;
    server_name_in_redirect on;
    port_in_redirect off;
    merge_slashes on;

    # Types: nginx's table plus the web manifest; text types carry charset=utf-8 like Pages.
    include /etc/nginx/mime.types;
    types { application/manifest+json webmanifest; }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json application/manifest+json application/xml;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/css text/plain text/xml application/javascript application/json application/manifest+json image/svg+xml application/xml;

    # Pages: max-age=600 (+ Expires) on every successful answer and redirect, none on a 404; ACAO * everywhere.
    expires 10m;
    add_header Access-Control-Allow-Origin "*" always;

    # 404.html answers with status 404: the site-wide not-found page AND the /pay/<token>, /pay/s/<secret> router.
    error_page 404 /404.html;

    # Generated from seo/url-migration.mjs — every moved path, one 301, query kept.
    include /srv/magicesim/current/nginx/redirects.conf;

    # / is a page, never a redirect — except the old home's deep link /?country=XX for a code with a page.
    location = / {
        if ($country_redirect) {
            return 301 $country_redirect$country_rest_q;
        }
        try_files /index.html =404;
    }

    # Pages' file resolution: the file, then <path>.html, then a directory (one 301 to the slash form, then index.html).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
