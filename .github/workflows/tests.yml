# Storefront — the gateway proxy function's tests.
#
# WHY THIS EXISTS
#
#   Audit finding 18: no CI in any repository ran a test. This one has a
#   workflow already, but it refreshes the catalog cache — it does not test
#   anything.
#
#   The proxy function is the storefront's write-failover path. It is what
#   carries a checkout retry to the second origin, and the whole failover design
#   rests on that retry landing on the FIRST order rather than creating a second.
#   107 tests cover its header forwarding, its status handling and its body
#   passthrough, and until now nothing ran them.
#
# WHAT IT NEEDS: NOTHING.
#
#   Pure offline unit tests over the function's request/response shaping. No
#   network, no credential, no Yandex Cloud access.
#
#   NOTE: this repository is PUBLIC. Every job here must stay credential-free
#   for that reason alone — a workflow that needed a secret would expose it to
#   any fork's pull request.

name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proxy-function:
    name: gateway proxy function (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/yandex-api-gateway/proxy-function

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # The function has no dependencies to install; it is plain Node.
      - name: Proxy tests
        run: node --test proxy.test.js

  # The suite runs in TWO SHARDS in parallel (Playwright --shard=1/2 and 2/2): together they are exactly the whole
  # suite — Playwright splits the test list deterministically, no test is in both and none is left out
  # (seo/test-ci-browser-shards.mjs pins the shape). One job ran ~20 min by 2026-10-22 (1320 tests), and a slow
  # browser install pushed it past its limit with no failing test. fail-fast is off so a red shard never cancels the
  # other: both always report. «browser-result» below is the ONE check that says whether the whole suite passed.
  browser:
    name: Mini App browser tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    # A limit is for a hang, not for the suite: up to 3 × 6 min of install + ~11 min of one shard.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` rather than `npm install`: the lockfile is the point. The site
      # itself still has no build step and no runtime dependency — this installs
      # the test runner and nothing else (four packages, one of them optional
      # and darwin-only).
      - name: Install the test runner
        run: npm ci

      # Chromium for the suite, WebKit for the flag tests only (the
      # `webkit-flags` project in playwright.config.js). `--with-deps` pulls the
      # system libraries the browsers need on a bare runner; it is the browsers
      # that are downloaded here, not another dependency of the site.
      # The system libraries come from the runner's Ubuntu mirror, which sometimes stalls: on 2026-10-22 the same step
      # took ~1 min on one runner and was cut by the job limit after 25 min on another (~60 of 204 packages fetched).
      # Each attempt is cut after 6 min and retried; three stalls fail the job here, with a clear error, before any test.
      # A retry never skips a browser — the step succeeds only when the whole install did.
      - name: Install Chromium and WebKit
        timeout-minutes: 20
        shell: bash
        run: |
          for attempt in 1 2 3; do
            timeout --kill-after=30s 6m npx playwright install --with-deps chromium webkit && exit 0
            echo "::warning::browser install attempt $attempt failed or stalled after 6 min; retrying"
            sudo pkill -x apt-get || true
            sudo dpkg --configure -a || true
          done
          echo "::error::browser install failed three times"
          exit 1

      # Runs both viewport projects: 390x844 and 320x568, 27 cases each.
      #
      # NOTHING REAL IS TOUCHED, which is why this job needs no secret and can
      # safely run on a fork's pull request: the web server is a static file
      # server over this repository and every API call is fulfilled from a
      # fixture inside the browser. No backend, no Platega, no order.
      - name: Browser tests
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # Only on failure, and only the report: a trace is the difference between
      # "flaky" and "here is what the page was doing", and it is the one thing a
      # CI failure cannot be re-created from locally.
      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # The verdict over every shard. GitHub shows one check per shard; this job is green ONLY when the whole matrix
  # succeeded — a failed, cancelled or skipped shard (or a cancelled run) makes it red. `always()` so it reports even
  # when a shard failed; the result is read from an env var, never interpolated into the script.
  browser-result:
    name: Mini App browser tests (all shards)
    needs: browser
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.browser.result }}
        run: |
          echo "browser shards: $RESULT"
          test "$RESULT" = "success"

  unit:
    name: storefront + Mini App unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # No `npm ci`, deliberately: these are plain `node --test` files with no
      # dependency of any kind. They ran green in this repository long before a
      # package.json existed, and adding an install step would invent a reason
      # for them to fail.
      #
      # `npm test` rather than the command spelled out again, so the glob lives
      # in ONE place. That matters more than it looks: `seo/*.mjs` would match
      # the page GENERATORS as well as the tests, and running them rewrites 202
      # HTML pages on disk. The script says `seo/test-*.mjs` for that reason —
      # never widen it.
      - name: Unit tests
        run: npm test

  # The Mini App's own browser scripts, test/mini-app/*.e2e.js: WebKit (as iOS Telegram's WKWebView) and Chromium, both
  # themes, every API faked at the network edge — nothing real is touched, same as `browser`. Until 2026-10-20 nothing
  # ran them in CI: two had been red unseen, one since 2026-09-03. The runner reads the DIRECTORY, so a new script is
  # included without editing this file; three at a time (~6 min; one by one they take ~16).
  miniapp-scripts:
    name: Mini App scripts (WebKit + Chromium)
    runs-on: ubuntu-24.04
    # Up to 3 × 6 min of browser install (the retry below) + ~7 min of scripts.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install the test runner
        run: npm ci

      # The system libraries come from the runner's Ubuntu mirror, which sometimes stalls: on 2026-10-22 the same step
      # took ~1 min on one runner and was cut by the job limit after 25 min on another (~60 of 204 packages fetched).
      # Each attempt is cut after 6 min and retried; three stalls fail the job here, with a clear error, before any test.
      # A retry never skips a browser — the step succeeds only when the whole install did.
      - name: Install Chromium and WebKit
        timeout-minutes: 20
        shell: bash
        run: |
          for attempt in 1 2 3; do
            timeout --kill-after=30s 6m npx playwright install --with-deps chromium webkit && exit 0
            echo "::warning::browser install attempt $attempt failed or stalled after 6 min; retrying"
            sudo pkill -x apt-get || true
            sudo dpkg --configure -a || true
          done
          echo "::error::browser install failed three times"
          exit 1

      - name: Mini App scripts
        run: node test/mini-app/run-all.mjs
