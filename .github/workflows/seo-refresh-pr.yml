name: SEO refresh PR

# Rebuilds the static SEO pages after the catalogue moves, and puts the result in
# a pull request. It never writes to main.
#
# WHY THIS EXISTS. assets/catalog.json is refreshed up to six times a day by
# "Refresh static catalog cache"; the ~200 pages built from it were rebuilt only
# when a person remembered. On 2026-09-14 the provider withdrew six PER_DAY plans
# at 100 ₽/day and six country pages went on advertising «от 300 ₽» — the
# three-day minimum of a plan nobody could buy any more — while five of them
# counted a daily tariff that no longer existed. Nothing noticed for two days.
#
# WHY A PULL REQUEST AND NOT A COMMIT. Committing straight to main would publish
# through Pages immediately, which means a bot rewriting and shipping the text of
# 198 pages six times a day with nobody looking. The generators are deterministic
# and gated, but «deterministic» is not «right»: a page's text is a commercial
# claim, and the class of defect this automation exists to prevent — a price that
# cannot be paid — is exactly the class a generator can also produce from bad
# input. So the machine prepares the change and a person decides.
#
# WHY workflow_run AND NOT push. A push made with GITHUB_TOKEN does not start
# another workflow; measured, not assumed — none of the last eight catalogue-bot
# commits ever triggered tests.yml. A `push` trigger here would therefore never
# fire from the job it is meant to follow. `workflow_run` is driven by the
# completion of the named workflow, not by the push it made, so it does fire.
#
# THE SAME RULE APPLIES TO THIS JOB'S OWN OUTPUT: the branch push and the pull
# request are made with GITHUB_TOKEN, so tests.yml does NOT run on the PR. That
# is why the full validation below runs HERE, before the PR is created or
# updated, and why its result is written into the PR body. tests.yml runs again
# on main when a human merges, because that push is the human's.
#
# NOTHING ABOUT THE CATALOGUE SYNC CHANGES. That workflow keeps reading the
# public catalogue endpoint and committing assets/catalog.json to main exactly as
# before; this one starts after it finishes and touches nothing it owns.

on:
  workflow_run:
    workflows: ["Refresh static catalog cache"]
    types: [completed]
  workflow_dispatch:

# The least that can open a pull request. No PAT: nothing here needs to reach
# another repository, and a secret in a PUBLIC repo is a liability that buys
# nothing. `contents: write` is for the automation branch only — main is never
# pushed to by this file.
permissions:
  contents: write
  pull-requests: write
  # Только чтение и только ради одного вопроса: на каком SHA этот workflow
  # проходил в последний раз. Без него окно «что изменилось на входе» пришлось бы
  # считать от предыдущего коммита — а это враньё ровно в том случае, ради
  # которого всё затевалось: человек ломает гейт кодом, следом бот дважды
  # обновляет каталог, и окно «от прошлого коммита» показывает один каталог.
  actions: read

# Runs queue rather than cancel. Each run regenerates from whatever main holds at
# the moment it starts, so the LAST run to finish is the one built from the
# newest catalogue — last-wins without a half-finished push in the middle, which
# is what cancel-in-progress would risk during the branch update.
concurrency:
  group: seo-refresh-pr
  cancel-in-progress: false

jobs:
  refresh:
    name: rebuild SEO pages and open a PR
    # THE BROWSER TIER RUNS IN THE «browser» JOBS BELOW, BEFORE THIS ONE (2026-10-27). Until then it ran here, in one
    # process after a `playwright install --with-deps` from the runner's Ubuntu mirror, and five refreshes in a row
    # (2026-10-26 13:13 … 10-27 00:35) hit the 25-minute limit with no failing test: the install stalled for 21–22 min
    # on three of them, the suite itself took 21–23 min on the other two. tests.yml had fixed both on 2026-10-22 (#129:
    # Microsoft's Playwright image, two shards); this file had not followed. The limit is unchanged — the work moved.
    #
    # `!cancelled()` so that a red shard still reaches «Проверки — браузер» (which turns it into this job's failure) and
    # «Разбор падения» (which explains it); `needs.pin.result` keeps the old rule that a failed catalogue run is not
    # followed — «pin» carries that condition.
    needs: [pin, browser]
    if: ${{ !cancelled() && needs.pin.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    # THE TOKEN IS NOT HERE, DELIBERATELY. At job scope it would be in the
    # environment of `npm ci`, which executes lifecycle scripts from the whole
    # dependency tree, and of the Playwright download — while holding
    # `contents: write` on a repository whose main is unprotected and publishes
    # to Pages on push. «This file never writes to main» would then be a property
    # of the text, not of the credential. It is granted to the two steps that
    # actually talk to GitHub and to nothing else.
    env:
      BRANCH: automation/catalogue-seo-refresh

    steps:
      # Explicitly main, and the whole history. Not the workflow_run's head: the
      # catalogue commit is already on main by the time this starts, and §9 of
      # the brief is that regeneration must happen from current main and the
      # current canonical catalogue — never from whatever the automation branch
      # happens to hold.
      # `persist-credentials: false` for the same reason the token is not at job
      # scope: by default checkout leaves a usable credential in .git/config for
      # every later step, which puts push access to main inside `npm ci`. The push
      # below builds its own authenticated remote for the one command that needs it.
      #
      # Pinned by commit, not by tag: v4 is mutable, and this job holds write
      # access. Since R3-12 every workflow here pins by commit (tests.yml too, so
      # that «require SHA pinning» can be switched on for the repository);
      # seo/test-workflow-hardening.mjs enforces it.
      #
      # `ref` is main AS «pin» READ IT, not «main» again: the browser shards built and tested exactly that commit, and
      # the catalogue bot can move main while they run. The build is a pure function of the commit (proved below by
      # «Воспроизводимость»), so the tree here is the tree they tested — and «Проверки — браузер» checks the commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pin.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Снимок артефактов до пересборки
        id: snapshot
        run: |
          set -euo pipefail
          mkdir -p /tmp/seo-before
          cp seo/catalogue-countries.json /tmp/seo-before/
          cp seo/fact-sheets.json         /tmp/seo-before/
          cp seo/sitemap-lastmod.json     /tmp/seo-before/
          cp sitemap.xml                  /tmp/seo-before/
          echo "снято: $(ls /tmp/seo-before | tr '\n' ' ')"

      # The ordinary command, unchanged and unparameterised. If this fails the
      # job fails here and no branch and no pull request are touched.
      - name: Пересборка
        id: rebuild
        run: node seo/build-all.mjs

      # BEFORE anything else looks at the result. An unexpected file is the one
      # failure mode that must stop the run while the damage is still local.
      - name: Только ожидаемые файлы
        id: paths
        run: |
          set -euo pipefail
          # -uall: without it git collapses a new directory to «?? esim/x/», which is
          # not an allowlisted path — so the first country the provider ever adds
          # would halt the run, the one case the allowlist promises to survive.
          git status --porcelain -uall > /tmp/seo-changed.txt
          node scripts/seo-refresh-check-paths.mjs --status /tmp/seo-changed.txt

      - name: Есть ли что публиковать
        id: diff
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -uall)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "сгенерированные страницы не изменились"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain -uall | sed 's/^/  /'
          fi

      # A rebuild that is not a pure function of the committed snapshot cannot be
      # reviewed — every run would be a diff and «regenerate and confirm nothing
      # changed» would be unrunnable. Proved per run rather than trusted.
      - name: Воспроизводимость
        id: repro
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          tree() { find esim en/esim en/destinations.js es/esim es/destinations.js de/esim de/destinations.js fr/esim fr/destinations.js zh/esim zh/destinations.js ko/esim ko/destinations.js seo sitemap.xml -type f \( -name '*.html' -o -name '*.json' -o -name '*.xml' -o -name '*.js' \) \
                   | sort | xargs sha256sum | sha256sum | cut -d' ' -f1; }
          first="$(tree)"
          node seo/build-all.mjs > /dev/null
          second="$(tree)"
          echo "хеш дерева: $first → $second"
          if [ "$first" != "$second" ]; then
            echo "ОСТАНОВ: повторная сборка дала другой результат — вывод не воспроизводим, PR не трогаем" >&2
            git status --porcelain -uall >&2
            exit 1
          fi

      # Everything the pages are checked by: catalogue consistency, fact-floor,
      # the editorial gates, canonical, structured data, sitemap and asset
      # versioning all live in `npm test`. The browser tier is run too because a
      # regenerated country page is what it renders.
      #
      # The gateway proxy tier is deliberately NOT run: it lives in
      # infra/yandex-api-gateway/proxy-function, reads no catalogue, and cannot
      # change here — the path allowlist above would have stopped the run if it had.
      - name: Проверки — гейты витрины
        id: gates
        if: steps.diff.outputs.changed == 'true'
        # tee, а не просто npm test: когда гейт краснеет, PR создать нельзя, и
        # его тело — обычный канал автоматики — не появляется. Хвост этого файла
        # попадает в сводку прогона, иначе наружу выходит голый крестик.
        # PIPESTATUS[0], а не код tee, иначе падение теста стало бы успехом.
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/seo-gates.log
          exit "${PIPESTATUS[0]}"

      # The browser tier ran in the «browser» shards (below in this file, before this job in time), on THIS commit. This
      # step is their verdict here: green only when every shard succeeded AND both actually tested a changed tree. A
      # shard that saw no change skips the suite — if this job sees a change the shards did not, the build was not the
      # same and nothing was tested, so it stops rather than vouching for an untested tree.
      - name: Проверки — браузер
        id: browser
        if: steps.diff.outputs.changed == 'true'
        env:
          RESULT: ${{ needs.browser.result }}
          TESTED: ${{ needs.browser.outputs.tested }}
          PINNED: ${{ needs.pin.outputs.sha }}
        run: |
          set -euo pipefail
          echo "браузерные шарды: $RESULT, проверили изменённое дерево: ${TESTED:-нет}"
          test "$(git rev-parse HEAD)" = "$PINNED"
          test "$RESULT" = "success"
          test "$TESTED" = "true"

      - name: Сводка изменений
        id: summary
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          level=$(node scripts/seo-refresh-summary.mjs \
            --before /tmp/seo-before \
            --out /tmp/seo-summary \
            --changed /tmp/seo-changed.txt \
            --validation "гейты витрины: зелёные|браузерные тесты: зелёные|воспроизводимость: подтверждена|изменены только сгенерированные артефакты")
          echo "risk=$level" >> "$GITHUB_OUTPUT"
          {
            echo "## Пересборка SEO-страниц"
            echo
            cat /tmp/seo-summary/summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      # THE BRANCH. Rebuilt from current main every time rather than added to, so
      # the pull request always shows main → newest generated state and nothing
      # older. That means a force-push, and a force-push is exactly the thing that
      # can erase someone's work — so two guards, both of which fail closed:
      #
      #   1. Every commit the remote branch carries beyond its merge-base with
      #      main must be this automation's own. One commit by anybody else, or
      #      with any other subject, and the run stops: a person has edited the
      #      branch and a machine must not decide what happens to that.
      #   2. --force-with-lease pinned to the exact SHA just fetched. If anything
      #      moves the branch between the check and the push, the push is refused
      #      rather than winning the race.
      - name: Ветка
        id: branch
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SUBJECT='chore(seo): refresh pages after catalogue update'
          BOT_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'

          # THE ALLOWLIST IS CHECKED AGAIN, HERE, AND THAT IS NOT BELT AND BRACES.
          # Between the first check and this line the tree was rebuilt a second
          # time and `npm test` ran — and `npm test` is not read-only:
          # seo/test-sitemap-lastmod.mjs runs the generators against ROOT by
          # design, unlinks seo/sitemap-lastmod.json and restores it from memory
          # in a `finally`. The restore is correct today. `git add` would stage
          # whatever is on disk NOW, so the invariant has to be re-established
          # against the tree that is actually being committed, not the one that
          # existed four steps ago.
          git status --porcelain -uall > /tmp/seo-changed-final.txt
          node scripts/seo-refresh-check-paths.mjs --status /tmp/seo-changed-final.txt

          git config user.name  "github-actions[bot]"
          git config user.email "$BOT_EMAIL"

          # `ls-remote --exit-code` rather than the exit status of `fetch`: fetch
          # cannot tell «no such branch» from «the network blinked», and the
          # earlier version silently took the «branch does not exist» path on a
          # transient failure — skipping the guard below and clearing the lease.
          # It happened to still fail closed, because an unleased non-fast-forward
          # push is refused, but by luck rather than by design.
          lease=""
          set +e
          git ls-remote --exit-code origin "refs/heads/$BRANCH" > /tmp/seo-branch-ref.txt
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            git fetch --no-tags origin "$BRANCH":refs/remotes/origin/"$BRANCH"
            remote_sha=$(git rev-parse refs/remotes/origin/"$BRANCH")
            base=$(git merge-base origin/main refs/remotes/origin/"$BRANCH")
            echo "ветка существует: $remote_sha, общий предок с main: $base"

            # -x: WHOLE LINE. As a substring match this passed anything that
            # merely CONTAINED the expected author and subject — a revert whose
            # subject quotes the original, or «…update <- backdoor» — and the
            # force-push then overwrote a person's commit. Identity is compared
            # on the committer e-mail as well, which is not free text.
            foreign=$(git log --format='%an|%ae|%s' "$base..refs/remotes/origin/$BRANCH" \
                      | grep -v -x -F "github-actions[bot]|$BOT_EMAIL|$SUBJECT" || true)
            if [ -n "$foreign" ]; then
              echo "ОСТАНОВ: на ветке есть коммиты не этой автоматики:" >&2
              echo "$foreign" | sed 's/^/  /' >&2
              echo "Ветка не трогается и PR не обновляется. Разберитесь вручную." >&2
              exit 1
            fi
            lease="--force-with-lease=refs/heads/$BRANCH:$remote_sha"
          elif [ "$rc" -eq 2 ]; then
            echo "ветки ещё нет — будет создана"
          else
            echo "ОСТАНОВ: не удалось выяснить, существует ли ветка (ls-remote код $rc)" >&2
            exit 1
          fi

          git checkout -B "$BRANCH"
          # Never `git add .`: only the paths the allowlist just vouched for.
          git add -- esim en/esim en/destinations.js es/esim es/destinations.js de/esim de/destinations.js fr/esim fr/destinations.js zh/esim zh/destinations.js ko/esim ko/destinations.js seo/catalogue-countries.json seo/fact-sheets.json seo/sitemap-lastmod.json sitemap.xml

          # WOULD THIS COMMIT SAY ANYTHING NEW?
          #
          # `write-tree` is exactly the tree the next commit would carry, so
          # comparing it with the remote branch's tree answers that before a
          # commit object exists — no throwaway commit, no second push to undo.
          #
          # This matters because the refresh runs on `workflow_run` from the
          # catalogue job, and that job COMPLETES six times a day whether or not
          # it commits. While a pull request is open, every one of those runs used
          # to force-push a byte-identical tree: measured 2026-09-16, PR #3 went
          # 5615090 -> 3f5f88b with tree 862913c89707 on both sides. A force-push
          # dismisses review approvals, so «review now, merge later» quietly
          # stopped meaning anything, and the one rewrite that mattered was buried
          # among identical ones.
          #
          # The rule lives in seo/refresh-noop.mjs so it is tested by calling it
          # rather than by grepping this file. Its fail-closed direction is PUSH:
          # one unreadable sha and the behaviour is what shipped before.
          staged_tree=$(git write-tree)
          main_sha=$(git rev-parse origin/main)
          remote_tree=""
          if [ "$rc" -eq 0 ]; then
            remote_tree=$(git rev-parse "refs/remotes/origin/$BRANCH^{tree}")
          fi
          decision=$(node scripts/seo-refresh-should-push.mjs \
            --branch-exists "$([ "$rc" -eq 0 ] && echo true || echo false)" \
            --staged-tree "$staged_tree" \
            --remote-tree "$remote_tree" \
            --remote-base "${base:-}" \
            --main "$main_sha")
          verdict=$(printf '%s\n' "$decision" | head -1)
          reason=$(printf '%s\n' "$decision" | tail -1)
          echo "$verdict: $reason"

          if [ "$verdict" = "skip" ]; then
            echo "noop=true" >> "$GITHUB_OUTPUT"
            echo "sha=$remote_sha" >> "$GITHUB_OUTPUT"
            {
              echo "## Пересборка не понадобилась"
              echo
              echo "$reason"
              echo
              echo "Ветка \`$BRANCH\` осталась на \`$remote_sha\`: ни коммита, ни force-push."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "$SUBJECT"

          # The credential exists for this one command and is not left in
          # .git/config for anything that runs later.
          git push "https://x-access-token:$GH_TOKEN@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/heads/$BRANCH:refs/heads/$BRANCH" $lease

          pushed=$(git rev-parse HEAD)
          echo "sha=$pushed" >> "$GITHUB_OUTPUT"
          echo "запушено: $pushed"

      # `${{ }}` is NOT interpolated into the shell below. The value here is one
      # of three literals this repository's own code produces, so nothing is
      # exploitable today — but an expression expanded into a `run:` block is the
      # standard Actions injection shape, and the habit is what fails later when
      # the value is somebody else's. Through env, it is a variable the shell
      # reads, never text the shell parses.
      - name: Pull request
        id: pr
        if: steps.diff.outputs.changed == 'true'
        env:
          RISK: ${{ steps.summary.outputs.risk }}
          HEAD_SHA: ${{ steps.branch.outputs.sha }}
          NOOP: ${{ steps.branch.outputs.noop }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE='chore(seo): refresh pages after catalogue update'

          # Asked BEFORE the body is written, because on a no-op the body must not
          # be rewritten either: an edit plus a «обновлено» comment six times a day
          # is the same churn moved from the branch to the conversation.
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          if [ "${NOOP:-}" = "true" ] && [ -n "$existing" ]; then
            echo "PR #$existing уже описывает ровно это состояние — тело и комментарии не трогаю"
            exit 0
          fi
          # NOOP with no open pull request is NOT nothing to do: the branch holds
          # the right tree and nobody can see it. Fall through and open one.

          # The body is written before the commit exists, so on its own it
          # describes a STATE and names no head — and a reviewer cannot tell
          # whether it still describes the branch they are looking at. The commit
          # it vouches for is stamped in here, after the push. It matters because
          # tests.yml does not run on this PR (GITHUB_TOKEN pushes start no
          # workflow), so this body is the only evidence attached to it.
          {
            echo
            echo "Коммит, который описывает эта сводка: \`$HEAD_SHA\`."
            echo "Если на ветке появится что-то ещё — сводка к нему не относится."
          } >> /tmp/seo-summary/summary.md

          if [ -n "$existing" ]; then
            echo "обновляю существующий PR #$existing — второго не создаём"
            gh pr edit "$existing" --title "$TITLE" --body-file /tmp/seo-summary/summary.md
            gh pr comment "$existing" --body "Обновлено новой пересборкой каталога. Риск: **$RISK**."
          else
            if ! gh pr create --base main --head "$BRANCH" \
                 --title "$TITLE" --body-file /tmp/seo-summary/summary.md; then
              echo "" >&2
              echo "PR создать не удалось. Самая вероятная причина — в настройках репозитория" >&2
              echo "выключено «Allow GitHub Actions to create and approve pull requests»" >&2
              echo "(Settings → Actions → General → Workflow permissions). Ветка $BRANCH уже" >&2
              echo "запушена, так что PR можно открыть руками; автоматике достаточно включить" >&2
              echo "эту галочку — PAT для этого не нужен." >&2
              exit 1
            fi
          fi

      # ЕДИНСТВЕННЫЙ ШАГ, КОТОРЫЙ ГОВОРИТ, КОГДА ГОВОРИТЬ БОЛЬШЕ НЕЧЕМ.
      #
      # Любая остановка выше означает: ветки нет, PR нет, «Сводка изменений» не
      # выполнялась — она стоит ПОСЛЕ проверок. Наружу выходил голый красный
      # крестик, и `workflow_run` повторял его до шести раз в сутки, одинаково
      # для сломанного генератора и для движения каталога у поставщика.
      #
      # Шаг НЕ МОЖЕТ повлиять на исход прогона: он идёт под `if: failure()`,
      # ничего не пишет в репозиторий и всегда выходит с нулём. Прогон обязан
      # остаться красным — сводка объясняет падение, а не отменяет его.
      - name: Разбор падения
        id: triage
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Через env, а не подстановкой в тело: значения здесь свои, но
          # выражение, раскрытое прямо в `run:`, — стандартная форма инъекции в
          # Actions, и привычка ломается позже, когда значение станет чужим.
          O_SNAPSHOT: ${{ steps.snapshot.outcome }}
          O_REBUILD: ${{ steps.rebuild.outcome }}
          O_PATHS: ${{ steps.paths.outcome }}
          O_DIFF: ${{ steps.diff.outcome }}
          O_REPRO: ${{ steps.repro.outcome }}
          O_GATES: ${{ steps.gates.outcome }}
          O_BROWSER: ${{ steps.browser.outcome }}
          O_SUMMARY: ${{ steps.summary.outcome }}
          O_BRANCH: ${{ steps.branch.outcome }}
          O_PR: ${{ steps.pr.outcome }}
        # `set +e` ПЕРВОЙ СТРОКОЙ, и это не украшение. Actions запускает `run:`
        # как `bash -e {0}` (runner: ScriptHandlerHelpers, ["sh"] = "-e {0}"),
        # поэтому `set -uo pipefail` флаг НЕ снимает. Первая же версия этого шага
        # написала в комментарии «без set -e» и умирала на первом же неответившем
        # `gh` — молча, с пустой сводкой, ровно в том случае, ради которого шаг и
        # написан. Проверено запуском тела шага под `bash -e`.
        run: |
          set +e
          set -uo pipefail

          # Первый упавший шаг в порядке выполнения и есть причина: всё, что
          # ниже, либо пропущено, либо следствие. Порядок строк здесь совпадает с
          # порядком шагов для читаемости, но ни на что не влияет: пока в файле
          # нет `continue-on-error`, упасть может ровно один шаг, и `awk … exit`
          # найдёт его при любом порядке. Состав имён тест держит, порядок — нет.
          step=$(printf '%s\n' \
            "Снимок артефактов до пересборки|$O_SNAPSHOT" \
            "Пересборка|$O_REBUILD" \
            "Только ожидаемые файлы|$O_PATHS" \
            "Есть ли что публиковать|$O_DIFF" \
            "Воспроизводимость|$O_REPRO" \
            "Проверки — гейты витрины|$O_GATES" \
            "Проверки — браузер|$O_BROWSER" \
            "Сводка изменений|$O_SUMMARY" \
            "Ветка|$O_BRANCH" \
            "Pull request|$O_PR" \
            | awk -F'|' '$2 == "failure" { print $1; exit }')

          # The browser tier runs in the shard jobs, so a shard that died installing (npm ci, the image) shows up here
          # only as «Проверки — браузер». That is the environment, not the catalogue or the code: name it as such, by
          # reading the shards' own steps (read-only, `actions: read`).
          if [ "$step" = "Проверки — браузер" ]; then
            install=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
                        --jq '.jobs[].steps[] | select(.name == "Шард — установка тест-раннера") | .conclusion' 2>/dev/null)
            if printf '%s\n' "${install:-}" | grep -qx failure; then step="Проверки — установка браузера"; fi
          fi

          # ОПОРА — ПОСЛЕДНИЙ ПРОГОН, В КОТОРОМ ГЕЙТЫ ДЕЙСТВИТЕЛЬНО ПРОШЛИ,
          # а не просто последний зелёный. Всё после «Есть ли что публиковать»
          # висит на `changed == 'true'`, а каталожная задача завершается шесть
          # раз в сутки независимо от того, коммитила ли она. Поэтому обычный
          # зелёный прогон — это чаще всего прогон, где гейты ПРОПУЩЕНЫ: на
          # 2026-09-18 таких было девять из десяти последних, и свежайший из них
          # менял как раз файл гейта. Опереться на него значило бы поручиться за
          # код, который ни разу не исполнялся, и назвать «данными» падение,
          # вызванное этим самым кодом. Это ровно то направление ошибки, которого
          # классификатор избегает.
          inputs=/tmp/seo-inputs.txt
          echo unknown > "$inputs"
          base=""
          runs=$(gh run list --workflow=seo-refresh-pr.yml --status=success \
                   --branch main --limit 20 --json databaseId,headSha \
                   --jq '.[] | "\(.databaseId) \(.headSha)"' 2>/dev/null)
          while read -r rid rsha; do
            [ -z "${rid:-}" ] && continue
            concl=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid/jobs" \
                      --jq '.jobs[].steps[] | select(.name == "Проверки — гейты витрины") | .conclusion' \
                      2>/dev/null)
            if [ "${concl:-}" = "success" ]; then base="$rsha"; break; fi
          done <<< "$runs"

          # Сравнивать нужно с тем деревом, которое СОБИРАЛОСЬ, а не с github.sha:
          # checkout берёт `ref: main`, а прогоны выстраиваются в очередь
          # (`cancel-in-progress: false`), поэтому собранный коммит может быть
          # новее события. Коммит с кодом, попавший в этот зазор, иначе стал бы
          # невидим — и падение из-за него назвалось бы данными.
          head=$(git rev-parse HEAD)
          if [ -n "$base" ] && [ "$base" = "$head" ]; then
            echo none > "$inputs"
          elif [ -n "$base" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$head" \
                      --jq '.files[].filename' 2>/dev/null)
            rc=$?
            # Пустой ответ при успешном запросе — это «не изменилось ничего»,
            # а не «выяснить не удалось». Различие меняет класс с UNKNOWN на CODE.
            if [ "$rc" -eq 0 ]; then
              if [ -n "${files:-}" ]; then printf '%s\n' "$files" > "$inputs"; else echo none > "$inputs"; fi
            fi
          fi

          node scripts/seo-refresh-report.mjs \
            --step "$step" --inputs "$inputs" --run-url "$RUN_URL" --log /tmp/seo-gates.log \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Ничего не изменилось
        if: steps.diff.outputs.changed != 'true'
        run: |
          echo "no generated SEO changes" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Каталог мог измениться, но ни одна страница, ни карта сайта и ни один лист фактов" >> "$GITHUB_STEP_SUMMARY"
          echo "от этого не поменялись. PR не создаётся." >> "$GITHUB_STEP_SUMMARY"

  # The commit every job of this run builds. Read once, here, so the shards and «refresh» cannot build two different
  # mains. It also carries the old entry rule: a failed catalogue run is not followed.
  pin:
    name: pin main
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: SHA main
        id: sha
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "этот прогон собирает main = $sha"

  # THE BROWSER TIER, in two shards — the same shape and the same image as tests.yml (#129). The browsers and their
  # system libraries come preinstalled in Microsoft's Playwright image (the lockfile's version, pinned by digest —
  # seo/test-seo-refresh.mjs holds it equal to tests.yml's), so nothing is downloaded from the runner's mirror.
  # READ-ONLY: no token, `contents: read`; `npm ci` runs dependency lifecycle scripts, and none of them can push.
  # Each shard rebuilds the pages itself from the pinned commit (seconds) and runs its half of the suite only when the
  # rebuild changed a generated file — a catalogue run that moves no page costs two short jobs, not two suites.
  browser:
    name: SEO refresh browser tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: pin
    runs-on: ubuntu-24.04
    # A limit is for a hang, not for the suite: one shard runs ~10–15 min.
    timeout-minutes: 25
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    outputs:
      tested: ${{ steps.shard_changed.outputs.changed }}
    # Inside a container `run:` defaults to `sh -e` (dash), which has no `pipefail`: the first dispatch of this job
    # (2026-10-27, run 40458841455) died on «set: Illegal option -o pipefail» before building anything.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pin.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      # The same generated tree «refresh» hashes in «Воспроизводимость»; a page that changes moves the hash.
      - name: Шард — пересборка
        id: shard_changed
        run: |
          set -euo pipefail
          tree() { find esim en/esim en/destinations.js es/esim es/destinations.js de/esim de/destinations.js fr/esim fr/destinations.js zh/esim zh/destinations.js ko/esim ko/destinations.js seo sitemap.xml -type f \( -name '*.html' -o -name '*.json' -o -name '*.xml' -o -name '*.js' \) \
                   | sort | xargs sha256sum | sha256sum | cut -d' ' -f1; }
          before="$(tree)"
          node seo/build-all.mjs > /dev/null
          after="$(tree)"
          echo "хеш дерева: $before → $after"
          if [ "$before" = "$after" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "страницы не изменились — браузерный ярус не нужен"
          else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Шард — установка тест-раннера
        id: shard_install
        if: steps.shard_changed.outputs.changed == 'true'
        run: npm ci

      - name: Шард — браузер
        id: shard_browser
        if: steps.shard_changed.outputs.changed == 'true'
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Шард — отчёт при падении
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seo-refresh-playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
