      if(k==='order_id'){v=String(v);return /^[A-Za-z0-9_-]{4,16}$/.test(v)?v:undefined;}   // short order ref only, never the 43-char token
      if(k==='promo_code'){v=String(v).toUpperCase();return /^[A-Z0-9_-]{1,32}$/.test(v)?v:undefined;}
      if(k==='currency'){v=String(v).toUpperCase();return v==='RUB'?v:undefined;}
      if(k==='payment_method'){v=String(v);return /^(sbp|card)$/.test(v)?v:undefined;}

<body>
  <main class="card" id="card">
    <div class="brand">Magic eSIM</div>
    <div class="spinner" id="spinner"></div>
    <div class="icon hide" id="icon">✓</div>
    <h1 id="title">Проверяем оплату</h1>
    <p class="msg" id="message">Не закрывайте страницу. Мы проверяем статус платежа.</p>
    <p class="sub" id="sub">По вопросам оплаты — <a href="mailto:support@magicesim.store">support@magicesim.store</a></p>
    <div class="actions">
      <a class="btn" href="index.html">Вернуться на главную</a>
    </div>
  </main>

  <script>
    (function () {
      var API_BASE = 'https://api.magicesim.store';
      var params = new URLSearchParams(location.search);
      var token = (params.get('token') || params.get('public_order_token') || '').trim();
      if (!/^[A-Za-z0-9_-]{16,128}$/.test(token)) token = '';

      var card = document.getElementById('card');
      var spinner = document.getElementById('spinner');
      var icon = document.getElementById('icon');
      var titleEl = document.getElementById('title');
      var msgEl = document.getElementById('message');

      var STATES = {
        processing: { title: 'Проверяем оплату', msg: 'Не закрывайте страницу. Мы проверяем статус платежа.', spin: true },
        confirmed:  { title: 'Оплата подтверждена', msg: 'Спасибо! Платёж получен. Данные вашей eSIM придут на указанный email.', spin: false, cls: 'ok', ic: '✓' },
        preparing:  { title: 'Подготавливаем eSIM', msg: 'Оплата подтверждена. Формируем вашу eSIM — это займёт немного времени.', spin: true },
        done:       { title: 'eSIM готова', msg: 'eSIM отправлена на ваш email. Проверьте входящие и папку «Спам».', spin: false, cls: 'ok', ic: '✓' },
        tech_error: { title: 'Оплата подтверждена', msg: 'Платёж получен, но при подготовке eSIM возникла техническая заминка. Мы уже разбираемся. Если eSIM не придёт в ближайшее время — напишите нам, мы поможем.', spin: false, cls: 'warn', ic: '!' },
        canceled:   { title: 'Платёж не завершён', msg: 'Оплата не была завершена. Вы можете вернуться к тарифам и попробовать снова.', spin: false, cls: 'warn', ic: '!' },
        fallback:   { title: 'Проверяем оплату', msg: 'Если вы завершили оплату, детали eSIM придут на указанный email. По вопросам — напишите в поддержку.', spin: false }
      };

      function render(key) {
        var s = STATES[key] || STATES.fallback;
        titleEl.textContent = s.title;
        msgEl.textContent = s.msg;
        card.classList.remove('ok', 'warn');
        if (s.cls) card.classList.add(s.cls);
        if (s.spin) { spinner.classList.remove('hide'); icon.classList.add('hide'); }
        else { spinner.classList.add('hide'); if (s.ic) { icon.textContent = s.ic; icon.classList.remove('hide'); } }
      }

      // Analytics: fire payment_success ONCE, only when the status poll confirms a
      // received payment (paid / purchasing_esim / completed). Never on page-open.
      var paidFired = false;
      function firePaymentSuccess(){
        var ctx = {}; try { ctx = JSON.parse(sessionStorage.getItem('magic_pay_ctx') || '{}') || {}; } catch (e) {}
        if (window.magicMetrikaGoal) window.magicMetrikaGoal('payment_success', { payment_type: ctx.payment_type, price_rub: ctx.price_rub });
        try { sessionStorage.removeItem('magic_pay_ctx'); } catch (e) {}
      }

      render('processing');

      // No token -> we cannot poll; show a safe neutral message.
      if (!token) { render('fallback'); return; }

      var TERMINAL = { completed: 'done', provider_failed: 'tech_error', canceled: 'canceled', refund_required: 'canceled' };
      var attempts = 0, MAX = 40; // ~ up to 3–4 min

      function mapView(view) {
        var st = view && view.status;
        if (TERMINAL[st]) return TERMINAL[st];
        if (st === 'purchasing_esim') return 'preparing';
        if (st === 'paid') return 'confirmed';
        return 'processing'; // awaiting_payment / unknown
      }

      function poll() {
        attempts++;
        fetch(API_BASE + '/api/v1/public/retail-orders/' + encodeURIComponent(token) + '/status', { headers: { Accept: 'application/json' } })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (view) {
            var key = view ? mapView(view) : 'processing';
            render(key);
            if (!paidFired && (key === 'confirmed' || key === 'preparing' || key === 'done')) { paidFired = true; firePaymentSuccess(); }
            // Stop on terminal states. This page never confirms payment itself.
            if (view && TERMINAL[view.status]) return;
            if (attempts >= MAX) return; // stop polling; leave last known state
            setTimeout(poll, 4000);
          })
          .catch(function () {
            // Never show raw errors. Keep trying quietly, then fall back.
            if (attempts >= MAX) { render('fallback'); return; }
            setTimeout(poll, 5000);
          });
      }
      poll();
    })();
  </script>
</body>
